name: Build coova-chilli with JSON and Kernel Acceleration (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
        g++-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
        file wget python3-setuptools python3-dev python-is-python3 zstd

    - name: Download and extract OpenWrt SDK (aarch64)
      run: |
        wget https://downloads.openwrt.org/releases/25.12.5/targets/bcm27xx/bcm2711/openwrt-sdk-25.12.5-bcm27xx-bcm2711_gcc-14.3.0_musl.Linux-x86_64.tar.zst
        tar --zstd -xf openwrt-sdk-*.tar.zst
        rm openwrt-sdk-*.tar.zst
        mv $(find . -maxdepth 1 -type d -name "openwrt-sdk-*") sdk

    - name: Add coova-chilli package
      run: |
        git clone https://github.com/openwisp/coova-chilli-openwrt.git
        cp -r coova-chilli-openwrt/coova-chilli sdk/package/coova-chilli

    - name: Configure and build package
      run: |
        cd sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # Core dependencies
        echo "CONFIG_PACKAGE_libjson-c=y" >> .config
        echo "CONFIG_PACKAGE_libuci=y" >> .config
        echo "CONFIG_PACKAGE_libnl-tiny=y" >> .config
        echo "CONFIG_PACKAGE_libopenssl=y" >> .config
        echo "CONFIG_PACKAGE_haserl=y" >> .config
        echo "CONFIG_PACKAGE_iptables=y" >> .config

        # Force coova-chilli package
        echo "CONFIG_PACKAGE_coova-chilli=m" >> .config

        # Feature flags
        echo "CONFIG_COOVACHILLI_JSONINTERFACE=y" >> .config
        echo "CONFIG_COOVACHILLI_OPENSSL=y" >> .config
        echo "CONFIG_COOVACHILLI_MINIPORTAL=y" >> .config
        echo "CONFIG_COOVACHILLI_REDIR=y" >> .config
        echo "CONFIG_COOVACHILLI_USERAGENT=y" >> .config
        echo "CONFIG_COOVACHILLI_UAMDOMAINFILE=y" >> .config

        make defconfig
        make package/coova-chilli/compile -j$(nproc) V=s

        echo "=== ALL BUILT PACKAGES ==="
        find bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec ls -lh {} +

    - name: Upload all package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coova-chilli-aarch64-artifacts
        path: sdk/bin/**/*.*pk
